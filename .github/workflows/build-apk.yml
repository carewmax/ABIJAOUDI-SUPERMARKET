name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (bundled so the app also opens offline)
        run: |
          mkdir -p www/vendor
          cp index.html www/index.html
          cp -r assets www/assets
          npm install --no-save react@18.3.1 react-dom@18.3.1 htm@3.1.1
          cp node_modules/react/umd/react.production.min.js www/vendor/
          cp node_modules/react-dom/umd/react-dom.production.min.js www/vendor/
          cp node_modules/htm/dist/htm.umd.js www/vendor/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js#vendor/react.production.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js#vendor/react-dom.production.min.js#; s#https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js#vendor/htm.umd.js#' www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abijaoudi-Supermarket-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
