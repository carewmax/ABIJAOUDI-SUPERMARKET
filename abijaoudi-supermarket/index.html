<title>Abijaoudi Supermarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=Dancing+Script:wght@600;700&display=swap">
<style>
/* Layout concept: royal-blue framed storefront. Blue header and footer, a photographic navy hero, white product cards on a pale-blue ground. */
:root{
  --brand:#0b2bc2; --navy:#050f4a; --sky:#4d9bff; --ice:#eef3ff; --line:#d7e0fa;
  --bg:#f3f6ff; --surface:#ffffff; --tile:#ffffff; --fg:#0c1642; --muted:#56628f;
  --price:#0b2bc2; --btn:#0b2bc2; --btn-h:#0a22a0; --btn-fg:#ffffff;
  --red:#d92d29; --green:#117a38; --focus:#1747e0; --shadow:0 8px 24px rgba(11,43,194,.12);
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --script:'Dancing Script','Brush Script MT',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#0a1fa3; --bg:#060b26; --surface:#0e1642; --fg:#e9eeff; --muted:#a2aedb; --line:#26327d; --ice:#121b52;
    --price:#9ab6ff; --btn:#2f5bff; --btn-h:#4a72ff; --red:#ff6a65; --green:#47cf7c; --focus:#9dbcff;
    --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#0a1fa3; --bg:#060b26; --surface:#0e1642; --fg:#e9eeff; --muted:#a2aedb; --line:#26327d; --ice:#121b52;
  --price:#9ab6ff; --btn:#2f5bff; --btn-h:#4a72ff; --red:#ff6a65; --green:#47cf7c; --focus:#9dbcff;
  --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{font-family:var(--body);font-size:16px;line-height:1.5;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1212px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:#fff;color:#0b2bc2;padding:8px 14px;border-radius:6px;font-weight:700}
.skip:focus{top:8px}
.page{animation:pagein .25s ease both}
@keyframes pagein{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* announcement */
.ann{background:var(--navy);color:#dbe6ff;font-size:13px}
.ann .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:7px}
.ann button{background:none;border:0;color:#fff;display:grid;place-items:center;padding:2px;border-radius:4px}

/* header */
.hdr{background:var(--brand);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:60;box-shadow:0 2px 14px rgba(5,15,74,.35)}
.hdr .wrap{display:flex;align-items:center;gap:18px;min-height:66px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0;text-align:left}
.brand img{width:46px;height:46px;border-radius:50%;display:block}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font:700 25px/1 var(--display);letter-spacing:.03em}
.wm span{font:600 11px/1.3 var(--display);letter-spacing:.2em;margin-top:2px}
.nav{display:flex;gap:2px;margin-left:10px}
.nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;padding:8px 12px;border-bottom:2px solid transparent}
.nav a:hover{background:rgba(255,255,255,.1);border-radius:6px 6px 0 0}
.nav a.on{border-bottom-color:#fff}
.hsearch{margin-left:auto;display:flex;background:#fff;border-radius:6px;overflow:hidden;width:250px}
.hsearch input{border:0;outline:0;padding:9px 12px;font-size:14px;min-width:0;flex:1;background:#fff;color:#0c1642}
.hsearch button{border:0;background:#fff;color:#0b2bc2;padding:0 10px;display:grid;place-items:center}
.hicons{display:flex;gap:2px}
.iconbtn{background:none;border:0;color:#fff;position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:8px;text-decoration:none}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.badge{position:absolute;top:2px;right:0;background:#fff;color:#0b2bc2;font:700 11px/1 var(--body);min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.burger,.msearch{display:none}
.mmenu{background:var(--navy);border-top:1px solid rgba(255,255,255,.12)}
.mmenu .wrap{display:flex;flex-direction:column;padding-block:8px 14px}
.mmenu a{color:#fff;text-decoration:none;padding:13px 4px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.1);font-size:17px}
.mmenu a.on{color:var(--sky)}
@media (max-width:1000px){
  .nav,.hsearch{display:none}
  .hicons{margin-left:auto}
  .burger,.msearch{display:grid}
}
@media (min-width:1001px){.mmenu{display:none}}

/* buttons */
.btn{background:var(--btn);color:var(--btn-fg);border:0;border-radius:6px;padding:10px 18px;font:600 15px/1.2 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .15s,transform .1s}
.btn:hover{background:var(--btn-h)}
.btn:active{transform:scale(.98)}
.btn-lg{padding:13px 26px;font-size:16px}
.btn-block{width:100%}
.btn-line{background:transparent;color:var(--price);box-shadow:inset 0 0 0 1.5px var(--btn)}
.btn-line:hover{background:var(--ice)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.btn-white{background:#fff;color:#0b2bc2}
.btn-white:hover{background:#e9f0ff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--price);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

/* hero */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:var(--aisle) center/cover;opacity:.22;z-index:-3;filter:blur(1.5px)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050f4a 0%,rgba(5,15,74,.9) 38%,rgba(5,15,74,.25) 72%,rgba(5,15,74,.05) 100%);z-index:-1}
.hero-photo{position:absolute;top:0;bottom:0;right:0;width:min(62%,780px);background:var(--hero) center 62%/cover;z-index:-2;filter:saturate(1.15) contrast(1.05)}
.hero-in{padding-block:46px 56px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.hero-brand{display:flex;align-items:center;gap:14px;background:rgba(5,15,74,.55);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 20px 10px 12px}
.hero-brand img{width:78px;height:78px;border-radius:50%}
.hero-wm{display:flex;flex-direction:column;line-height:1}
.hero-wm b{font:800 46px/1 var(--display);letter-spacing:.03em}
.hero-wm span{font:700 22px/1.2 var(--display);letter-spacing:.14em}
.hero h1{font:800 clamp(38px,6.2vw,72px)/1 var(--display);letter-spacing:.005em;max-width:15ch}
.hero h1 em{display:block;font-style:normal;background:linear-gradient(90deg,#3b86ff,#78b5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:17px;color:#e3ecff}
.hero-sub i{font-style:normal;opacity:.7}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
@media (max-width:760px){
  .hero-photo{width:100%;opacity:.55}
  .hero::after{background:linear-gradient(180deg,rgba(5,15,74,.55),rgba(5,15,74,.92))}
  .hero-wm b{font-size:34px}.hero-wm span{font-size:17px}.hero-brand img{width:60px;height:60px}
  .hero-in{padding-block:32px 40px}
}

/* sections */
.sec{padding-block:36px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sh h2{font:700 32px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.cat-sec{background:var(--surface);border-bottom:1px solid var(--line);padding-block:26px}
.cat-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.cat-tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .2s,box-shadow .2s,border-color .2s}
.cat-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--btn)}
.ct-img{width:100%;aspect-ratio:84/50;background:var(--tile);border-radius:8px;display:grid;place-items:center;overflow:hidden;margin-bottom:8px}
.ct-img img{width:100%;height:100%;object-fit:contain;transition:transform .3s}
.cat-tile:hover .ct-img img{transform:scale(1.07)}
.cat-tile b{font:700 20px/1.1 var(--display);letter-spacing:.02em}
.cat-tile small{color:var(--muted);font-size:13px}
@media (max-width:760px){.cat-row{grid-template-columns:repeat(2,minmax(0,1fr))}.cat-tile:last-child{grid-column:1/-1}}
.benefits{background:linear-gradient(90deg,#0b2bc2,#0a1fa3);color:#fff}
.benefits .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-block:20px}
.bn{display:flex;gap:12px;align-items:center}
.bn .ic{width:36px;height:36px;color:#9cc4ff}
.bn b{display:block;font-size:15px}
.bn small{color:#c9d8ff;font-size:13px}
@media (max-width:900px){.benefits .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.benefits .wrap{grid-template-columns:1fr}}

/* product card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s;min-width:0}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--btn)}
.pimg{position:relative;aspect-ratio:1/1;background:var(--tile);display:block;padding:14px}
.pimg a{display:block;width:100%;height:100%}
.pimg img{width:100%;height:100%;object-fit:contain;transition:transform .3s}
.pcard:hover .pimg img{transform:scale(1.06)}
.disc{position:absolute;left:10px;top:10px;background:#d92d29;color:#fff;font:700 13px/1 var(--body);padding:5px 8px;border-radius:5px;z-index:1}
.heart{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:1px solid #dbe3fb;background:#fff;color:#51608f;display:grid;place-items:center;z-index:1}
.heart:hover{color:#d92d29}
.heart.on{color:#d92d29;border-color:#f3b5b3}
.heart.on svg{fill:currentColor}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3{font:600 16px/1.25 var(--body)}
.pbody h3 a{text-decoration:none}
.pbody h3 a:hover{text-decoration:underline}
.sz{color:var(--muted);font-weight:500}
.price{font:700 23px/1.1 var(--display);color:var(--price);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.price s{font:500 15px var(--body);color:var(--muted);margin-left:6px}
.pbody .btn{margin-top:auto}

/* banners */
.banner{position:relative;background:var(--navy);color:#fff;overflow:hidden;isolation:isolate}
.bimg{position:absolute;top:0;bottom:0;right:0;width:min(58%,720px);background:var(--img) center/cover;z-index:-1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 48%);mask-image:linear-gradient(90deg,transparent,#000 48%);filter:saturate(1.1)}
.banner .wrap{padding-block:34px}
.banner h1{font:800 clamp(38px,5.4vw,60px)/1 var(--display);letter-spacing:.01em}
.banner p{color:#d6e2ff;font-size:18px;margin-top:6px}
.seal{position:absolute;right:max(16px,calc(50% - 590px));top:50%;transform:translateY(-50%) rotate(8deg);width:116px;height:116px;border-radius:50%;background:#d92d29;color:#fff;display:grid;place-content:center;text-align:center;font:800 15px/1 var(--display);letter-spacing:.06em;box-shadow:0 8px 20px rgba(0,0,0,.35);border:3px solid #fff}
.seal b{display:block;font-size:40px;line-height:.95}
@media (max-width:640px){.seal{width:84px;height:84px;font-size:12px}.seal b{font-size:28px}}

/* shop */
.shop-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:28px 48px;align-items:start}
.cats{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:90px}
.cats h2{font:700 21px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.cats ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cats button{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.cats button:hover{background:var(--ice)}
.cats button.on{background:var(--btn);color:#fff;font-weight:600}
.cats em{font-style:normal;opacity:.65;font-size:12.5px;font-variant-numeric:tabular-nums;align-self:center}
@media (max-width:860px){
  .shop-layout{grid-template-columns:minmax(0,1fr);gap:16px}
  .cats{position:static;padding:10px;border-radius:10px}
  .cats h2{display:none}
  .cats ul{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .cats li{flex:none}
  .cats button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
  .cats em{display:none}
}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{font:700 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.toolbar small{color:var(--muted);display:block;font-size:14px;margin-top:4px}
.sortbox{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.sel,.field input,.field textarea,.field select{background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;font-size:15px;width:100%}
.sortbox .sel{width:auto}
.field input:focus,.field textarea:focus,.field select:focus,.sel:focus{border-color:var(--btn);outline:none;box-shadow:0 0 0 3px rgba(47,91,255,.25)}
.more{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:26px;color:var(--muted);font-size:14px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:44px;height:44px;color:var(--price)}
.empty h3{font:700 26px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.empty p{color:var(--muted);max-width:46ch}
.empty .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* search */
.bigsearch{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.bigsearch .ic{margin:0 0 0 14px;align-self:center;color:var(--muted)}
.bigsearch input{flex:1;min-width:0;border:0;outline:0;padding:16px 12px;font-size:18px;background:transparent}
.bigsearch .btn{border-radius:0;padding-inline:22px}
.bigsearch:focus-within{border-color:var(--btn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--ice);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px}
.chip:hover,.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.lbl{font:700 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:24px 0 10px}

/* product detail */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted);padding-block:16px 6px}
.crumbs a{color:var(--muted)}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;padding-block:14px 30px}
@media (max-width:820px){.pd{grid-template-columns:minmax(0,1fr);gap:20px}}
.gal-main{background:var(--tile);border:1px solid var(--line);border-radius:14px;aspect-ratio:1/1;display:grid;place-items:center;padding:24px;position:relative;width:100%}
.gal-main img{width:100%;height:100%;object-fit:contain}
.gal-main .zoom{position:absolute;right:12px;bottom:12px;background:var(--btn);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumbs button{width:72px;height:72px;border:2px solid var(--line);border-radius:8px;background:var(--tile);padding:4px}
.thumbs button.on{border-color:var(--btn)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.pinfo{display:flex;flex-direction:column;gap:12px;min-width:0}
.pinfo h1{font:800 clamp(34px,4.4vw,48px)/1 var(--display);letter-spacing:.01em}
.pinfo .big{font:700 38px/1 var(--display);color:var(--price);font-variant-numeric:tabular-nums}
.pinfo .big s{font:500 20px var(--body);color:var(--muted);margin-left:8px}
.muted{color:var(--muted)}
.stars{display:inline-flex;gap:2px;color:#f2a900}
.stars svg{fill:currentColor;stroke:none}
.stars .off{color:var(--line)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.qty button{width:38px;height:40px;border:0;background:none;display:grid;place-items:center}
.qty button:hover{background:var(--ice)}
.qty span{min-width:38px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.buyrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.buyrow .btn{flex:1;min-width:180px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-top:10px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:11px 16px;font-weight:600;white-space:nowrap;color:var(--muted)}
.tabs button.on{color:var(--price);border-bottom-color:var(--btn)}
.tabpane{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:22px}
.review{border-bottom:1px solid var(--line);padding-block:14px}
.review:last-child{border-bottom:0}
.note{background:var(--ice);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--fg)}
.note.ok{border-color:var(--green)}
.note.err{border-color:var(--red)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field .err{color:var(--red);font-size:13px}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--red)}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.two{grid-template-columns:minmax(0,1fr)}}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;color:var(--line);padding:2px}
.starpick button.on{color:#f2a900}
.starpick svg{fill:currentColor;stroke:none}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(3,8,40,.88);z-index:120;display:grid;place-items:center;padding:20px}
.lb-in{background:#fff;border-radius:14px;padding:20px;max-width:min(680px,100%);width:100%;aspect-ratio:1/1;max-height:90vh;position:relative}
.lb-in img{width:100%;height:100%;object-fit:contain}
.lb-x{position:absolute;right:-6px;top:-46px;background:#fff;color:#0b2bc2;border:0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}

/* cart */
.cartpage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-block:14px 50px;align-items:start}
@media (max-width:900px){.cartpage{grid-template-columns:minmax(0,1fr)}}
.lines{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lhead,.line{display:grid;grid-template-columns:minmax(0,1fr) 90px 130px 100px 36px;gap:12px;align-items:center;padding:12px 16px}
.lhead{background:var(--ice);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.line{border-top:1px solid var(--line)}
.line .nm{display:flex;gap:12px;align-items:center;min-width:0}
.line .nm img{width:58px;height:58px;object-fit:contain;background:var(--tile);border-radius:8px;padding:4px;border:1px solid var(--line);flex:none}
.line .nm a{font-weight:600;text-decoration:none}
.line .nm a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.xbtn{background:none;border:0;color:var(--muted);width:34px;height:34px;display:grid;place-items:center;border-radius:6px}
.xbtn:hover{color:var(--red);background:var(--ice)}
.lt-m{display:none}
@media (max-width:640px){
  .lhead{display:none}
  .line{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm x" "qty tot";row-gap:10px}
  .line .nm{grid-area:nm}.line .qty{grid-area:qty;justify-self:start}.line .tot{grid-area:tot;justify-self:end}.line .xbtn{grid-area:x}
  .line .unit{display:none}
}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;position:sticky;top:90px}
.sum h2{font:700 24px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.srow{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.srow.t{font:700 26px/1 var(--display);padding-top:12px;border-top:1px solid var(--line);color:var(--price)}
.srow span:last-child{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:900px){.sum{position:static}}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(3,8,40,.55);z-index:90;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:91;display:flex;flex-direction:column;animation:slide .25s ease both;box-shadow:-10px 0 40px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--brand);color:#fff}
.dhead h2{font:700 24px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.dbody{flex:1;overflow-y:auto;padding:6px 18px}
.dline{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dline img{width:56px;height:56px;object-fit:contain;background:var(--tile);border-radius:8px;border:1px solid var(--line);padding:3px}
.dline .qty button{width:30px;height:32px}.dline .qty span{min-width:28px}
.dfoot{border-top:1px solid var(--line);padding:16px 18px;display:grid;gap:10px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:150;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:toast .25s ease both;max-width:calc(100% - 32px);font-weight:500}
.toast .ic{color:#6fe3a0}
@keyframes toast{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* about / contact */
.about-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding-block:40px}
@media (max-width:820px){.about-grid{grid-template-columns:minmax(0,1fr)}}
.about-grid h1{font:800 clamp(36px,5vw,54px)/1 var(--display)}
.about-grid h2{font:700 24px/1.1 var(--display);color:var(--price);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 14px}
.about-grid p{font-size:17px;max-width:56ch}
.shopfront{border-radius:14px;overflow:hidden;border:4px solid var(--brand);box-shadow:var(--shadow);aspect-ratio:138/106}
.shopfront img{width:100%;height:100%;object-fit:cover;display:block}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.pillars{grid-template-columns:minmax(0,1fr)}}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.pillar .ring{width:60px;height:60px;border-radius:50%;border:2px solid var(--btn);display:grid;place-items:center;color:var(--price)}
.pillar .ring .ic{width:28px;height:28px}
.pillar h3{font:700 22px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.pillar p{font-size:14.5px;color:var(--muted)}
.thanks{position:relative;isolation:isolate;color:#fff;border-radius:14px;overflow:hidden;min-height:230px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 32px;background:var(--navy)}
.thanks::before{content:"";position:absolute;inset:0;background:var(--aisle) center/cover;z-index:-2;filter:blur(1px) saturate(1.1)}
.thanks::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,15,74,.35),rgba(5,15,74,.85));z-index:-1}
.thanks p{font:700 clamp(30px,5vw,50px)/1.1 var(--script)}
.thanks img{width:84px;height:84px;border-radius:50%;flex:none}
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding-block:28px 50px}
@media (max-width:820px){.contact-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h2{font:700 25px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.crow{display:flex;gap:14px;padding-block:12px;border-bottom:1px solid var(--line);align-items:flex-start}
.crow:last-of-type{border-bottom:0}
.crow .ico{width:40px;height:40px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none}
.crow b{display:block}
.crow .ph{font-style:italic;color:var(--muted)}
.crow a{color:var(--price);font-weight:600}
.mapbox{margin-top:14px;border-radius:12px;border:1.5px dashed var(--line);min-height:150px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);background:var(--ice);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px}
.mapbox div{background:var(--surface);border-radius:10px;padding:12px 16px;max-width:36ch}

/* checkout / confirmation */
.cogrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;padding-block:14px 50px;align-items:start}
@media (max-width:900px){.cogrid{grid-template-columns:minmax(0,1fr)}}
.ptitle{font:800 clamp(34px,4.6vw,46px)/1 var(--display);padding-top:26px;letter-spacing:.01em}
.okmark{width:76px;height:76px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin-inline:auto}
.okmark .ic{width:40px;height:40px;stroke-width:2.6}
.conf{max-width:680px;margin:0 auto;padding-block:40px 60px;display:flex;flex-direction:column;gap:18px;text-align:center}
.conf h1{font:800 clamp(34px,5vw,48px)/1 var(--display)}
.conf .panel{text-align:left}
.refcode{font:700 24px/1 var(--display);letter-spacing:.12em;background:var(--ice);border:1px dashed var(--btn);padding:8px 14px;border-radius:8px;display:inline-block;color:var(--price)}

/* account */
.acct{padding-block:14px 50px}
.olist{display:grid;gap:12px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px}

/* footer */
.ftr{background:var(--navy);color:#cdd9ff;margin-top:20px}
.ftr .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:28px;padding-block:38px}
@media (max-width:900px){.ftr .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.ftr .wrap{grid-template-columns:minmax(0,1fr)}}
.ftr h4{font:700 18px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:#fff;margin-bottom:12px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14.5px}
.ftr a{color:#cdd9ff;text-decoration:none}
.ftr a:hover{color:#fff;text-decoration:underline}
.ftr .ph{font-style:italic;opacity:.75}
.ftr .brand{margin-bottom:12px}
.ftr .fine{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.14);padding-top:16px;font-size:13px;opacity:.8}
.ftr .brand img{width:54px;height:54px}

/* splash */
.splash{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 42%,#1038e0 0%,#050f4a 62%);display:grid;place-items:center;transition:opacity .4s ease}
.splash.out{opacity:0;pointer-events:none}
.splash div{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff}
.splash img{width:116px;height:116px;border-radius:50%;box-shadow:0 0 0 8px rgba(255,255,255,.1),0 0 60px rgba(77,155,255,.65);animation:pop .7s ease both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.splash b{font:800 34px/1 var(--display);letter-spacing:.06em}
.splash span{font:600 14px/1 var(--display);letter-spacing:.3em;margin-top:-6px}

function sortList(list,sort){
  const l=list.slice();
  if(sort==='price-asc')l.sort((a,b)=>a.price-b.price);
  else if(sort==='price-desc')l.sort((a,b)=>b.price-a.price);
  else if(sort==='name')l.sort((a,b)=>(a.name+(a.size||'')).localeCompare(b.name+(b.size||''),undefined,{numeric:true}));
  return l;
}

/* ---------- Routing ---------- */
const PLAIN=['shop','search','deals','about','contact','cart','checkout','confirmation','account'];
function parseHash(){
  let h='';try{h=(location.hash||'').replace(/^#\/?/,'')}catch(e){}
  if(!h)return {name:'home'};
  if(h.indexOf('product-')===0)return {name:'product',id:h.slice(8)};
  if(h.indexOf('shop-')===0)return {name:'shop',cat:h.slice(5)};
  if(PLAIN.indexOf(h)>-1)return {name:h};
  return {name:'home'};
}
function toHash(r){
  if(r.name==='home')return '';
  if(r.name==='product')return 'product-'+r.id;
  if(r.name==='shop'&&r.cat&&r.cat!=='all')return 'shop-'+r.cat;
  return r.name;
}

/* ---------- Search ---------- */
const POPULAR=['Rice','Cooking Oil','Sugar','Milo','Coca Cola','Toilet Paper','Shampoo','Indomie'];
function Search(){
  const {route,go}=useApp();
  const [q,setQ]=useState(route.q||'');
  const [sort,setSort]=useState('relevance');
  const [cat,setCat]=useState('all');
  const ref=useRef(null);
  useEffect(()=>{setQ(route.q||'')},[route.q]);
  useEffect(()=>{if(ref.current)ref.current.focus({preventScroll:true})},[]);
  const tokens=norm(q).split(/\s+/).filter(Boolean);
  const scored=useMemo(()=>{
    if(!tokens.length)return PRODUCTS.map((p,i)=>({p,s:0,i}));
    return PRODUCTS.map((p,i)=>{
      const name=norm(p.name),rest=norm([p.brand,catById[p.cat].name,p.size,p.tags,p.description].join(' '));
      let s=0;
      for(const t of tokens){
        if(name.indexOf(t)>-1)s+=3;else if(rest.indexOf(t)>-1)s+=1;else return {p,s:-1,i};
      }
      return {p,s,i};
    }).filter(x=>x.s>=0);
  },[q]);
  const cats=[...new Set(scored.map(x=>x.p.cat))];
  let res=scored.filter(x=>cat==='all'||x.p.cat===cat);
  if(sort==='relevance')res=res.slice().sort((a,b)=>b.s-a.s||a.i-b.i).map(x=>x.p);
  else res=sortList(res.map(x=>x.p),sort);
  const pick=t=>{setQ(t);setCat('all')};
  return html`<div className="page"><div className="wrap" style=${{paddingBlock:'26px 54px'}}>
    <form className="bigsearch" role="search" onSubmit=${e=>e.preventDefault()}>
      <${Icon} n="search" size=${22}/>
      <label className="sr" htmlFor="sq">Search for products</label>
      <input id="sq" ref=${ref} type="search" placeholder="Search for products..." value=${q} onChange=${e=>{setQ(e.target.value);setCat('all')}}/>
      <button className="btn" type="submit">Search</button>
    </form>
    <h2 className="lbl">Popular searches</h2>
    <div className="chips">${POPULAR.map(t=>html`<button key=${t} className=${'chip'+(norm(q)===norm(t)?' on':'')} onClick=${()=>pick(t)}>${t}</button>`)}</div>
    <div className="toolbar" style=${{marginTop:'28px'}}>
      <div><h2>Search results</h2><small>${tokens.length?html`Showing results for "${q.trim()}" · ${res.length} found`:'Showing all products. Type to narrow them down.'}</small></div>
      <div style=${{display:'flex',gap:'12px',flexWrap:'wrap'}}>
        ${cats.length>1?html`<label className="sortbox" htmlFor="scat">Category:<select id="scat" className="sel" value=${cat} onChange=${e=>setCat(e.target.value)}><option value="all">All</option>${cats.map(id=>html`<option key=${id} value=${id}>${catById[id].name}</option>`)}</select></label>`:null}
        <label className="sortbox" htmlFor="ssort">Sort by:<select id="ssort" className="sel" value=${sort} onChange=${e=>setSort(e.target.value)}><option value="relevance">Relevance</option><option value="price-asc">Price: Low to High</option><option value="price-desc">Price: High to Low</option><option value="name">Name: A to Z</option></select></label>
      </div>
    </div>
    ${res.length?html`<div className="grid">${res.map(p=>html`<${ProductCard} key=${p.id} p=${p}/>`)}</div>`
    :html`<${Empty} icon="search" title="No matching products found" text=${'Nothing matched "'+q.trim()+'". Check the spelling or try a shorter word like "rice" or "oil".'}>
      <button className="btn btn-line" onClick=${()=>{setQ('');setCat('all')}}>Clear search</button><button className="btn" onClick=${()=>go('shop')}>View all products</button><//>`}
  </div></div>`;
}

  return html`<div className="page" style=${{'--aisle':'url('+A.aisle+')'}}>
    <div className="wrap">
      <section className="about-grid">

          <h2>Quality Products. Happy Customers.</h2>
          <p>Abijaoudi Supermarket is your trusted partner for everyday essentials. We provide a wide range of quality products at affordable prices, ensuring a convenient and enjoyable shopping experience for you and your family.</p>
          <div style=${{display:'flex',gap:'12px',flexWrap:'wrap',marginTop:'20px'}}>
            <button className="btn btn-lg" onClick=${()=>go('shop')}>Shop all products</button>
            <button className="btn btn-lg btn-line" onClick=${()=>go('contact')}>Contact us</button>
          </div>
        </div>
        <div className="shopfront"><img src=${A.storefront} alt="Abijaoudi Supermarket storefront with its blue sign"/></div>
      </section>
      <section className="pillars" aria-label="What we stand for">

      <section style=${{paddingBlock:'34px 50px'}}>
        <div className="thanks"><p>Thank you for choosing Abijaoudi Supermarket</p><img src=${A.logo} alt="Abijaoudi logo"/></div>
      </section>
    </div>
  </div>`;
}

/* ---------- Contact ---------- */
function Contact(){
  const c=CONFIG.contact;
  const [f,setF]=useState({name:'',email:'',subject:'',message:''});
  const [err,setErr]=useState({});
  const [done,setDone]=useState(false);
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const submit=e=>{
    e.preventDefault();
    const x={};
    if(!f.name.trim())x.name='Please enter your name.';
    if(!/^\S+@\S+\.\S+$/.test(f.email.trim()))x.email='Enter a valid email address, like name@example.com.';
    if(!f.message.trim())x.message='Please write a message.';
    setErr(x);
    if(Object.keys(x).length===0){setDone(true)}else setDone(false);
  };
  const Row=({icon,label,value,href,placeholder})=>html`<div className="crow"><span className="ico"><${Icon} n=${icon} size=${20}/></span><div><b>${label}</b>${value?(href?html`<a href=${href}>${value}</a>`:html`<span>${value}</span>`):html`<span className="ph">${placeholder}</span>`}</div></div>`;
  return html`<div className="page">
    <section className="banner" style=${{'--img':'url('+A.contactfront+')'}}>
      <div className="bimg" aria-hidden="true" style=${{width:'min(52%,560px)'}}></div>
      <div className="wrap"><h1>Get In Touch</h1><p>We'd love to hear from you!</p></div>
    </section>
    <div className="wrap contact-grid">
      <section className="panel" aria-label="Contact details">
        <h2>Visit or call us</h2>
        <${Row} icon="pin" label="Visit us" value=${c.address} placeholder="Store address to be confirmed"/>
        <${Row} icon="phone" label="Call us" value=${c.phone} href=${c.phone?'tel:'+c.phone.replace(/\s+/g,''):''} placeholder="Phone number to be confirmed"/>
        <${Row} icon="mail" label="Email us" value=${c.email} href=${c.email?'mailto:'+c.email:''} placeholder="Email address to be confirmed"/>
        <${Row} icon="clock" label="Opening hours" value=${c.hours} placeholder="Opening hours to be confirmed"/>
        ${c.whatsapp?html`<a className="btn" style=${{marginTop:'10px'}} href=${'https://wa.me/'+c.whatsapp.replace(/\D/g,'')} target="_blank" rel="noopener noreferrer">Chat on WhatsApp</a>`:null}
        <div className="mapbox"><div>${c.mapsUrl?html`<a className="btn" href=${c.mapsUrl} target="_blank" rel="noopener noreferrer">View on Google Maps</a>`:'The map will appear here once the store address is confirmed.'}</div></div>
      </section>
      <section className="panel" aria-label="Send a message">
        <h2>Send us a message</h2>
        <form className="form" onSubmit=${submit} noValidate>
          <div className="field"><label htmlFor="cn">Full name</label><input id="cn" autoComplete="name" value=${f.name} onChange=${set('name')} aria-invalid=${!!err.name}/>${err.name?html`<span className="err">${err.name}</span>`:null}</div>
          <div className="field"><label htmlFor="ce">Email address</label><input id="ce" type="email" autoComplete="email" value=${f.email} onChange=${set('email')} aria-invalid=${!!err.email}/>${err.email?html`<span className="err">${err.email}</span>`:null}</div>
          <div className="field"><label htmlFor="cs">Subject (optional)</label><input id="cs" value=${f.subject} onChange=${set('subject')}/></div>
          <div className="field"><label htmlFor="cm">Message</label><textarea id="cm" rows="5" value=${f.message} onChange=${set('message')} aria-invalid=${!!err.message}></textarea>${err.message?html`<span className="err">${err.message}</span>`:null}</div>
          <button className="btn btn-lg" type="submit">Send Message</button>
          ${done?html`<div className="note" role="status">Demo mode: this form isn't connected to an inbox yet, so your message was not sent. To reach the store, use the contact details beside this form once they are added.</div>`:null}
        </form>
      </section>
    </div>
  </div>`;
}

/* ---------- Product detail ---------- */
function Product(){
  const {route,go,add,wish,toggleWish}=useApp();
  const p=byId[route.id];
  const [qty,setQty]=useState(1);
  const [img,setImg]=useState(0);
  const [tab,setTab]=useState('description');
  const [lb,setLb]=useState(false);
  const [reviews,setReviews]=useState(()=>store.get('reviews',{}));
  const [rf,setRf]=useState({rating:0,title:'',text:'',name:''});
  const [re,setRe]=useState({});
  const [rok,setRok]=useState(false);
  useEffect(()=>{setQty(1);setImg(0);setTab('description');setRok(false)},[route.id]);
  useEffect(()=>{
    if(!lb)return;
    const k=e=>{if(e.key==='Escape')setLb(false)};
    window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k);
  },[lb]);
  if(!p)return html`<div className="page wrap" style=${{paddingBlock:'50px'}}><${Empty} title="Product not found" text="This product may have been removed or the link is wrong."><button className="btn" onClick=${()=>go('shop')}>Back to Shop</button><//></div>`;
  const mine=reviews[p.id]||[];
  const avg=mine.length?Math.round(mine.reduce((s,r)=>s+r.rating,0)/mine.length):0;
  const on=wish.indexOf(p.id)>-1;
  const related=PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);
  const submitReview=e=>{
    e.preventDefault();
    const x={};
    if(!rf.rating)x.rating='Choose a star rating.';
    if(!rf.text.trim())x.text='Write a few words about the product.';
    setRe(x);
    if(Object.keys(x).length)return;
    const next={...reviews,[p.id]:[{rating:rf.rating,title:rf.title.trim(),text:rf.text.trim(),name:rf.name.trim()||'You',date:new Date().toLocaleDateString()},...mine]};
    setReviews(next);store.set('reviews',next);setRf({rating:0,title:'',text:'',name:''});setRok(true);
  };
  const cat=catById[p.cat];
  return html`<div className="page"><div className="wrap">
    <nav className="crumbs" aria-label="Breadcrumb">
      <${Link} to="home">Home<//><span>/</span><${Link} to=${{name:'shop',cat:p.cat}}>${cat.name}<//><span>/</span><span aria-current="page">${p.name}${p.size?' ('+p.size+')':''}</span>
    </nav>
    <section className="pd">
      <div>
        <div className="gal-main"><img src=${p.images[img]} alt=${label(p)}/><button className="zoom" onClick=${()=>setLb(true)} aria-label="View larger image"><${Icon} n="expand" size=${16}/> Enlarge</button></div>
        ${p.images.length>1?html`<div className="thumbs">${p.images.map((im,i)=>html`<button key=${i} className=${i===img?'on':''} aria-label=${'Show image '+(i+1)} onClick=${()=>setImg(i)}><img src=${im} alt=""/></button>`)}</div>`:null}
      </div>
      <div className="pinfo">
        <h1>${p.name}${p.size?html` <span className="muted" style=${{fontWeight:600}}>(${p.size})</span>`:null}</h1>
        <div className="big">${money(p.price)}${p.was?html`<s>${money(p.was)}</s>`:null}${p.was?html` <span className="disc" style=${{position:'static',marginLeft:'10px',verticalAlign:'middle',display:'inline-block'}}>-${pct(p)}%</span>`:null}</div>
        <div>${mine.length?html`<${Stars} n=${avg}/> <span className="muted"> ${mine.length} ${mine.length===1?'review':'reviews'} on this device</span>`:html`<span className="muted">No reviews yet · <button className="link" onClick=${()=>setTab('reviews')}>Write the first one</button></span>`}</div>
        <p>${p.description||html`<span className="muted">A full product description hasn't been added yet.</span>`}</p>
        <dl className="kv">
          <dt>Category</dt><dd><${Link} to=${{name:'shop',cat:p.cat}} cls="link">${cat.name}<//></dd>
          ${p.size?html`<dt>Size</dt><dd>${p.size}</dd>`:null}
          ${p.brand?html`<dt>Brand</dt><dd>${p.brand}</dd>`:null}
          <dt>Availability</dt><dd className="muted">To be confirmed by the store</dd>
        </dl>
        <div className="buyrow">
          <div className="qty" role="group" aria-label="Quantity">
            <button aria-label="Decrease quantity" onClick=${()=>setQty(Math.max(1,qty-1))}><${Icon} n="minus" size=${16}/></button>
            <span aria-live="polite">${qty}</span>
            <button aria-label="Increase quantity" onClick=${()=>setQty(Math.min(p.stock||99,qty+1))}><${Icon} n="plus" size=${16}/></button>
          </div>
          <button className="btn btn-lg" onClick=${()=>add(p,qty)}>Add to Cart</button>
        </div>
        <button className="btn btn-line" onClick=${()=>toggleWish(p)} aria-pressed=${on}><${Icon} n="heart" size=${18} cls=${on?'':''}/> ${on?'Saved to wishlist':'Add to Wishlist'}</button>
      </div>
    </section>
    <section aria-label="Product details">
      <div className="tabs" role="tablist">
        ${[['description','Description'],['reviews','Reviews ('+mine.length+')'],['shipping','Shipping']].map(([k,t])=>html`<button key=${k} role="tab" aria-selected=${tab===k} className=${tab===k?'on':''} onClick=${()=>setTab(k)}>${t}</button>`)}
      </div>
      <div className="tabpane" role="tabpanel">
        ${tab==='description'?html`<p className="muted">${p.description||'The store has not added product details yet. Ingredients, nutrition and storage information will be shown here once they are confirmed.'}</p>`:null}
        ${tab==='shipping'?html`<p className="muted">Delivery and pickup options haven't been confirmed yet. ${CONFIG.fulfilment.length?'Available: '+CONFIG.fulfilment.join(', ')+'.':'The store will confirm how you can receive your order.'}</p>`:null}
        ${tab==='reviews'?html`<div style=${{display:'grid',gap:'22px'}}>
          <div>
            ${mine.length?mine.map((r,i)=>html`<div className="review" key=${i}><${Stars} n=${r.rating}/> ${r.title?html`<b> ${r.title}</b>`:null}<p>${r.text}</p><small className="muted">${r.name} · ${r.date} · saved on this device</small></div>`)
            :html`<${Empty} icon="star" title="No reviews yet" text="Be the first to review this product."/>`}
          </div>
          <form className="form" onSubmit=${submitReview} noValidate style=${{maxWidth:'560px'}}>
            <h3 style=${{font:'700 22px/1 var(--display)',letterSpacing:'.04em',textTransform:'uppercase'}}>Write a review</h3>
            <div className="field"><span style=${{fontWeight:600,fontSize:'14px'}} id="rl">Your rating</span>
              <div className="starpick" role="group" aria-labelledby="rl">${[1,2,3,4,5].map(i=>html`<button type="button" key=${i} className=${i<=rf.rating?'on':''} aria-label=${i+(i===1?' star':' stars')} aria-pressed=${i===rf.rating} onClick=${()=>setRf({...rf,rating:i})}><svg width="28" height="28" viewBox="0 0 24 24" dangerouslySetInnerHTML=${{__html:ICONS.star}}/></button>`)}</div>
              ${re.rating?html`<span className="err">${re.rating}</span>`:null}</div>
            <div className="two">
              <div className="field"><label htmlFor="rn">Your name (optional)</label><input id="rn" value=${rf.name} onChange=${e=>setRf({...rf,name:e.target.value})}/></div>
              <div className="field"><label htmlFor="rt">Review title (optional)</label><input id="rt" value=${rf.title} onChange=${e=>setRf({...rf,title:e.target.value})}/></div>
            </div>
            <div className="field"><label htmlFor="rx">Review</label><textarea id="rx" rows="4" value=${rf.text} onChange=${e=>setRf({...rf,text:e.target.value})} aria-invalid=${!!re.text}></textarea>${re.text?html`<span className="err">${re.text}</span>`:null}</div>
            <button className="btn" type="submit" style=${{justifySelf:'start'}}>Submit review</button>
            ${rok?html`<div className="note" role="status">Saved on this device only. Reviews aren't published to other customers yet.</div>`:null}
          </form>
        </div>`:null}
      </div>
    </section>
    ${related.length?html`<section className="sec"><div className="sh"><h2>More in ${cat.name}</h2></div><div className="grid">${related.map(x=>html`<${ProductCard} key=${x.id} p=${x}/>`)}</div></section>`:html`<div style=${{height:'36px'}}></div>`}
    <div style=${{paddingBottom:'40px'}}><button className="btn btn-line" onClick=${()=>go('shop')}><${Icon} n="back" size=${18}/> Back to Shop</button></div>
    ${lb?html`<div className="lb" role="dialog" aria-modal="true" aria-label=${label(p)+' enlarged'} onClick=${()=>setLb(false)}><div className="lb-in" onClick=${e=>e.stopPropagation()}><button className="lb-x" aria-label="Close enlarged image" onClick=${()=>setLb(false)}><${Icon} n="close"/></button><img src=${p.images[img]} alt=${label(p)}/></div></div>`:null}
  </div></div>`;
}

/* ---------- Cart page ---------- */
function CartPage(){
  const {lines,subtotal,setQty,remove,go}=useApp();
  return html`<div className="page"><div className="wrap">
    <h1 className="ptitle">Your Cart</h1>
    <p className="muted" style=${{marginBottom:'14px'}}>${lines.length} ${lines.length===1?'item':'items'}</p>
    ${lines.length===0?html`<div style=${{paddingBottom:'50px'}}><${Empty} icon="cart" title="Your cart is empty" text="Browse the shop and add the products you need."><button className="btn btn-lg" onClick=${()=>go('shop')}>Continue shopping</button><//></div>`
    :html`<div className="cartpage">
      <div className="lines">
        <div className="lhead"><span>Product</span><span>Price</span><span>Quantity</span><span>Total</span><span></span></div>
        ${lines.map(l=>html`<div className="line" key=${l.id}>
          <div className="nm"><img src=${l.p.img} alt=${label(l.p)}/><${Link} to=${{name:'product',id:l.id}}>${label(l.p)}<//></div>
          <div className="num unit">${money(l.p.price)}</div>
          <div className="qty">
            <button aria-label=${'Decrease quantity of '+l.p.name} onClick=${()=>setQty(l.id,l.qty-1)}><${Icon} n="minus" size=${16}/></button>
            <span aria-live="polite">${l.qty}</span>
            <button aria-label=${'Increase quantity of '+l.p.name} onClick=${()=>setQty(l.id,l.qty+1)}><${Icon} n="plus" size=${16}/></button>
          </div>
          <div className="num tot">${money(l.p.price*l.qty)}</div>
          <button className="xbtn" aria-label=${'Remove '+l.p.name} onClick=${()=>remove(l.id)}><${Icon} n="trash" size=${18}/></button>
        </div>`)}
      </div>
      <aside className="sum">
        <h2>Order summary</h2>
        <div className="srow"><span>Subtotal</span><span>${money(subtotal)}</span></div>
        <div className="srow"><span>Delivery</span><span>${CONFIG.deliveryFee!=null?money(CONFIG.deliveryFee):'To be confirmed'}</span></div>
        <div className="srow t"><span>Total</span><span>${money(subtotal+(CONFIG.deliveryFee||0))}</span></div>
        <button className="btn btn-lg btn-block" onClick=${()=>go('checkout')}>Proceed to Checkout</button>
        <button className="btn btn-line btn-block" onClick=${()=>go('shop')}>Continue Shopping</button>
      </aside>
    </div>`}
  </div></div>`;
}

/* ---------- Checkout ---------- */
function Checkout(){
  const {lines,subtotal,go,placeOrder,profile}=useApp();
  const [f,setF]=useState({name:profile.name||'',phone:profile.phone||'',email:profile.email||'',address:profile.address||'',notes:'',method:CONFIG.fulfilment[0]||''});
  const [err,setErr]=useState({});
  const set=k=>e=>setF({...f,[k]:e.target.value});
  if(lines.length===0)return html`<div className="page wrap" style=${{paddingBlock:'50px'}}><${Empty} icon="cart" title="Your cart is empty" text="Add products before checking out."><button className="btn btn-lg" onClick=${()=>go('shop')}>Browse products</button><//></div>`;
  const total=subtotal+(CONFIG.deliveryFee||0);
  const submit=e=>{
    e.preventDefault();
    const x={};
    if(!f.name.trim())x.name='Please enter your name.';
    if(f.phone.replace(/\D/g,'').length<7)x.phone='Enter a phone number with at least 7 digits.';
    if(f.email.trim()&&!/^\S+@\S+\.\S+$/.test(f.email.trim()))x.email='That email address looks incomplete.';
    setErr(x);
    if(Object.keys(x).length)return;
    placeOrder(f);
  };
  return html`<div className="page"><div className="wrap">
    <h1 className="ptitle">Checkout</h1>
    <div className="note" style=${{margin:'14px 0'}}><b>Demo checkout.</b> Nothing is sent to the store and no payment is taken. Delivery, pickup and payment options haven't been confirmed yet.</div>
    <div className="cogrid">
      <form className="panel form" onSubmit=${submit} noValidate>
        <h2>Your details</h2>
        <div className="two">
          <div className="field"><label htmlFor="kn">Full name</label><input id="kn" autoComplete="name" value=${f.name} onChange=${set('name')} aria-invalid=${!!err.name}/>${err.name?html`<span className="err">${err.name}</span>`:null}</div>
          <div className="field"><label htmlFor="kp">Phone number</label><input id="kp" type="tel" autoComplete="tel" value=${f.phone} onChange=${set('phone')} aria-invalid=${!!err.phone}/>${err.phone?html`<span className="err">${err.phone}</span>`:null}</div>
        </div>
        <div className="field"><label htmlFor="ke">Email (optional)</label><input id="ke" type="email" autoComplete="email" value=${f.email} onChange=${set('email')} aria-invalid=${!!err.email}/>${err.email?html`<span className="err">${err.email}</span>`:null}</div>
        ${CONFIG.fulfilment.length?html`<div className="field"><label htmlFor="km">How would you like to receive your order?</label><select id="km" value=${f.method} onChange=${set('method')}>${CONFIG.fulfilment.map(m=>html`<option key=${m}>${m}</option>`)}</select></div>`:null}
        <div className="field"><label htmlFor="ka">Address or pickup notes (optional)</label><textarea id="ka" rows="3" autoComplete="street-address" value=${f.address} onChange=${set('address')}></textarea></div>
        <div className="field"><label htmlFor="kt">Order notes (optional)</label><textarea id="kt" rows="2" value=${f.notes} onChange=${set('notes')}></textarea></div>
        <button className="btn btn-lg" type="submit">Place Demo Order</button>
        <button className="btn btn-line" type="button" onClick=${()=>go('cart')}>Back to cart</button>
      </form>
      <aside className="sum">
        <h2>Review your order</h2>
        ${lines.map(l=>html`<div className="srow" key=${l.id}><span>${l.qty} × ${label(l.p)}</span><span>${money(l.p.price*l.qty)}</span></div>`)}
        <div className="srow" style=${{borderTop:'1px solid var(--line)',paddingTop:'10px'}}><span>Subtotal</span><span>${money(subtotal)}</span></div>
        <div className="srow"><span>Delivery</span><span>${CONFIG.deliveryFee!=null?money(CONFIG.deliveryFee):'To be confirmed'}</span></div>
        <div className="srow t"><span>Total</span><span>${money(total)}</span></div>
      </aside>
    </div>
  </div></div>`;
}

/* ---------- Confirmation ---------- */
function Confirmation(){
  const {lastOrder,go}=useApp();
  if(!lastOrder)return html`<div className="page wrap" style=${{paddingBlock:'50px'}}><${Empty} icon="box" title="No recent order" text="Place a demo order from your cart to see the confirmation here."><button className="btn" onClick=${()=>go('shop')}>Back to Shop</button><//></div>`;
  return html`<div className="page"><div className="wrap"><div className="conf">
    <div className="okmark"><${Icon} n="check"/></div>
    <h1>Demo order recorded</h1>
    <p className="muted">This is a demonstration. Your order was saved in this browser only. It has not been sent to Abijaoudi Supermarket and no payment was taken.</p>
    <div><span className="refcode">${lastOrder.ref}</span><div className="muted" style=${{fontSize:'13px',marginTop:'6px'}}>Demo reference</div></div>
    <div className="panel"><h2>Order summary</h2>
      ${lastOrder.items.map(i=>html`<div className="srow" key=${i.id} style=${{padding:'6px 0'}}><span>${i.qty} × ${i.name}</span><span>${money(i.price*i.qty)}</span></div>`)}
      <div className="srow t" style=${{marginTop:'10px'}}><span>Total shown</span><span>${money(lastOrder.total)}</span></div>
    </div>
    <div style=${{display:'flex',gap:'12px',justifyContent:'center',flexWrap:'wrap'}}>
      <button className="btn btn-lg" onClick=${()=>go('shop')}>Back to Shop</button>
      <button className="btn btn-lg btn-line" onClick=${()=>go('home')}>Go Home</button>
    </div>
  </div></div></div>`;
}

/* ---------- Account (prototype, saved on this device) ---------- */
function Account(){
  const {route,profile,saveProfile,wish,toggleWish,add,orders,go}=useApp();
  const [tab,setTab]=useState(route.tab||'profile');
  useEffect(()=>{if(route.tab)setTab(route.tab)},[route.tab]);
  const [f,setF]=useState(profile);
  const [saved,setSaved]=useState(false);
  const set=k=>e=>{setF({...f,[k]:e.target.value});setSaved(false)};
  const wl=wish.map(id=>byId[id]).filter(Boolean);
  return html`<div className="page"><div className="wrap acct">
    <h1 className="ptitle">Your Account</h1>
    <div className="note" style=${{margin:'14px 0'}}>Prototype: sign-in isn't connected to a server yet. Details below are saved on this device only.</div>
    <div className="tabs" role="tablist">
      ${[['profile','Profile'],['wishlist','Wishlist ('+wl.length+')'],['orders','Demo orders ('+orders.length+')']].map(([k,t])=>html`<button key=${k} role="tab" aria-selected=${tab===k} className=${tab===k?'on':''} onClick=${()=>setTab(k)}>${t}</button>`)}
    </div>
    <div className="tabpane" role="tabpanel">
      ${tab==='profile'?html`<form className="form" style=${{maxWidth:'560px'}} onSubmit=${e=>{e.preventDefault();saveProfile(f);setSaved(true)}}>
        <div className="field"><label htmlFor="an">Full name</label><input id="an" autoComplete="name" value=${f.name} onChange=${set('name')}/></div>
        <div className="two">
          <div className="field"><label htmlFor="ap">Phone number</label><input id="ap" type="tel" autoComplete="tel" value=${f.phone} onChange=${set('phone')}/></div>
          <div className="field"><label htmlFor="ae">Email</label><input id="ae" type="email" autoComplete="email" value=${f.email} onChange=${set('email')}/></div>
        </div>
        <div className="field"><label htmlFor="aa">Saved address</label><textarea id="aa" rows="3" value=${f.address} onChange=${set('address')}></textarea></div>
        <button className="btn" type="submit" style=${{justifySelf:'start'}}>Save details</button>
        ${saved?html`<div className="note ok" role="status">Saved on this device. They will pre-fill checkout.</div>`:null}
      </form>`:null}
      ${tab==='wishlist'?(wl.length?html`<div className="grid">${wl.map(p=>html`<${ProductCard} key=${p.id} p=${p}/>`)}</div>`
        :html`<${Empty} icon="heart" title="Your wishlist is empty" text="Tap the heart on any product to save it here."><button className="btn" onClick=${()=>go('shop')}>Browse products</button><//>`):null}
      ${tab==='orders'?(orders.length?html`<div className="olist">${orders.map(o=>html`<div className="order" key=${o.ref}><div style=${{display:'flex',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}}><b>${o.ref}</b><span className="muted">${o.date}</span></div><div className="muted">${o.items.map(i=>i.qty+' × '+i.name).join(', ')}</div><div className="num">${money(o.total)} · demo order, not sent to the store</div></div>`)}</div>`
        :html`<${Empty} icon="box" title="No demo orders yet" text="Orders you place in the demo checkout are listed here."><button className="btn" onClick=${()=>go('shop')}>Start shopping</button><//>`):null}
    </div>
  </div></div>`;
}

/* ---------- Splash ---------- */
function Splash({out}){
  return html`<div className=${'splash'+(out?' out':'')} role="presentation"><div><img src=${A.logo} alt=""/><b>ABIJAOUDI</b><span>SUPERMARKET</span></div></div>`;
}

/* ---------- App ---------- */
function App(){
  const [route,setRoute]=useState(parseHash);
  const routeRef=useRef(route);routeRef.current=route;
  const [cart,setCart]=useState(()=>store.get('cart',[]).filter(l=>byId[l.id]));
  const [wish,setWish]=useState(()=>store.get('wish',[]).filter(id=>byId[id]));
  const [orders,setOrders]=useState(()=>store.get('orders',[]));
  const [profile,setProfile]=useState(()=>store.get('profile',{name:'',phone:'',email:'',address:''}));
  const [drawer,setDrawer]=useState(false);
  const [menu,setMenu]=useState(false);
  const [toast,setToast]=useState(null);
  const [lastOrder,setLastOrder]=useState(null);
  const [splash,setSplash]=useState(0);
  const [ann,setAnn]=useState(true);

  useEffect(()=>{store.set('cart',cart)},[cart]);
  useEffect(()=>{store.set('wish',wish)},[wish]);
  useEffect(()=>{store.set('orders',orders)},[orders]);
  useEffect(()=>{store.set('profile',profile)},[profile]);
  useEffect(()=>{
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const a=setTimeout(()=>setSplash(1),reduce?200:900);
    const b=setTimeout(()=>setSplash(2),reduce?300:1350);
    return()=>{clearTimeout(a);clearTimeout(b)};
  },[]);
  useEffect(()=>{
    const f=()=>{let cur;try{cur=parseHash()}catch(e){return}if(toHash(routeRef.current)!==toHash(cur))setRoute(cur)};
    window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f);
  },[]);
  useEffect(()=>{window.scrollTo(0,0)},[route.name,route.id,route.cat]);
  useEffect(()=>{
    const k=e=>{if(e.key==='Escape'){setDrawer(false);setMenu(false)}};
    window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k);
  },[]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2400);return()=>clearTimeout(t)},[toast]);

  const go=useCallback(r=>{
    if(r==='__drawer'){setDrawer(true);return}
    if(typeof r==='string')r={name:r};
    setRoute(r);setDrawer(false);setMenu(false);
    try{const h=toHash(r);if(('#'+h)!==location.hash&&!(h===''&&location.hash===''))location.hash=h}catch(e){}
  },[]);
  const showToast=msg=>setToast({msg,k:Date.now()});
  const add=(p,q=1)=>{
    const cap=p.stock||99;
    setCart(c=>{
      const i=c.findIndex(l=>l.id===p.id);
      if(i>-1){const n=c.slice();n[i]={...n[i],qty:Math.min(cap,n[i].qty+q)};return n}
      return [...c,{id:p.id,qty:Math.min(cap,q)}];
    });
    showToast(label(p)+' added to cart');
  };
  const setQty=(id,q)=>{
    if(q<1){remove(id);return}
    const cap=byId[id].stock||99;
    setCart(c=>c.map(l=>l.id===id?{...l,qty:Math.min(cap,q)}:l));
  };
  const remove=id=>{setCart(c=>c.filter(l=>l.id!==id));showToast('Item removed from cart')};
  const toggleWish=p=>{
    const on=wish.indexOf(p.id)>-1;
    setWish(w=>on?w.filter(x=>x!==p.id):[...w,p.id]);
    showToast(on?'Removed from wishlist':'Saved to wishlist');
  };
  const lines=cart.map(l=>({...l,p:byId[l.id]})).filter(l=>l.p);
  const count=lines.reduce((s,l)=>s+l.qty,0);
  const subtotal=lines.reduce((s,l)=>s+l.qty*l.p.price,0);
  const placeOrder=f=>{
    const ref='DEMO-'+Math.random().toString(36).slice(2,7).toUpperCase();
    const o={ref,date:new Date().toLocaleString(),total:subtotal+(CONFIG.deliveryFee||0),items:lines.map(l=>({id:l.id,name:label(l.p),qty:l.qty,price:l.p.price})),customer:{name:f.name,phone:f.phone}};
    setOrders(x=>[o,...x]);setLastOrder(o);setCart([]);go('confirmation');
  };
  const saveProfile=f=>setProfile(f);

  const ctx={route,go,cart,lines,count,subtotal,add,setQty,remove,wish,toggleWish,orders,profile,saveProfile,drawer,setDrawer,lastOrder,placeOrder};
  let page;
  switch(route.name){
    case 'shop':page=html`<${Shop}/>`;break;
    case 'search':page=html`<${Search}/>`;break;
    case 'deals':page=html`<${Deals}/>`;break;
    case 'about':page=html`<${About}/>`;break;
    case 'contact':page=html`<${Contact}/>`;break;
    case 'product':page=html`<${Product}/>`;break;
    case 'cart':page=html`<${CartPage}/>`;break;
    case 'checkout':page=html`<${Checkout}/>`;break;
    case 'confirmation':page=html`<${Confirmation}/>`;break;
    case 'account':page=html`<${Account}/>`;break;
    default:page=html`<${Home}/>`;
  }
  return html`<${Ctx.Provider} value=${ctx}>
    <button className="skip" onClick=${()=>{const m=document.getElementById('main');if(m)m.focus()}}>Skip to content</button>
    ${CONFIG.announcement&&ann?html`<div className="ann" role="note"><div className="wrap"><span>${CONFIG.announcement}</span><button aria-label="Dismiss announcement" onClick=${()=>setAnn(false)}><${Icon} n="close" size=${16}/></button></div></div>`:null}
    <${Header} menu=${menu} setMenu=${setMenu}/>
    <main id="main" tabIndex="-1" key=${route.name+(route.id||'')+(route.cat||'')+(route.q||'')+(route.tab||'')} style=${{outline:'none'}}>${page}</main>
    <${Footer}/>
    <${CartDrawer}/>
    <${Toast} t=${toast}/>
    ${splash<2?html`<${Splash} out=${splash===1}/>`:null}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
